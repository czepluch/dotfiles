# Yazi configuration
# Only deviations from the defaults are set here:
# https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml

[mgr]
linemode = "size"

[preview]
tab_size = 4
image_filter = "lanczos3"
image_quality = 80

[opener]
image = [
  { run = 'imv %s', orphan = true, for = "linux" },
]
video = [
  { run = 'mpv %s', orphan = true, for = "linux" },
]
pdf = [
  { run = 'zathura %s', orphan = true, for = "linux" },
]
archive = [
  { run = 'file-roller %s', orphan = true, for = "linux" },
]

[open]
# First opener is the Enter default; the rest show up in the "open with" menu.
prepend_rules = [
  { mime = "image/*", use = ["image", "reveal"] },
  { mime = "video/*", use = ["video", "reveal"] },
  { mime = "application/pdf", use = ["pdf", "reveal"] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["archive", "extract", "reveal"] },
]

# Git status signs in the file list (git.yazi)
[[plugin.prepend_fetchers]]
id = "git"
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git"
group = "git"

# Previews piped through existing CLI tools (piper.yazi)
[[plugin.prepend_previewers]]
url = "*.csv"
run = 'piper -- bat -p --color=always "$1"'

[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# Archive contents in the preview pane (ouch.yazi)
[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run = "ouch"
