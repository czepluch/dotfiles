# Yazi keybindings
# Only deviations from the defaults are set here:
# https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/keymap-default.toml
# Notable defaults: s/S search via fd/rg, / find-as-you-type, z fzf, Z zoxide,
# . toggle hidden, m-chords for linemodes, gh/gc/gd for home/config/downloads.

[mgr]
prepend_keymap = [
  # Quick jumps
  { on = ["g", "D"], run = "cd ~/dev", desc = "Go to dev" },
  { on = ["g", "r"], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Go to git repo root" },

  # l opens files too, not just directories (smart-enter plugin)
  { on = ["l"], run = "plugin smart-enter", desc = "Enter directory or open file" },

  # Drop to a shell in the current directory
  { on = ["!"], run = 'shell "$SHELL" --block', for = "unix", desc = "Open $SHELL here" },

  # Yank also copies files to the Wayland clipboard as a URI list
  { on = ["y"], run = ['shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank"], desc = "Yank (also to clipboard)" },

  # Plugins
  { on = ["T"], run = "plugin toggle-pane max-preview", desc = "Maximize or restore preview" },
  { on = ["c", "m"], run = "plugin chmod", desc = "Chmod selected files" },
  { on = ["g", "i"], run = "plugin lazygit", desc = "Open lazygit" },
  # Output format follows the file extension you type; zip if none
  { on = ["c", "a"], run = "plugin ouch", desc = "Compress selection with ouch" },
]

[input]
prepend_keymap = [
  # Close input with a single Esc instead of Esc Esc
  { on = ["<Esc>"], run = "close", desc = "Cancel input" },
]
